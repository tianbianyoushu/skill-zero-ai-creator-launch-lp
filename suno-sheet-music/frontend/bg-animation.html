<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Gakufu Background</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #0A0D26;
    }
    #root { width: 100%; height: 100%; }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Zen+Old+Mincho:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">

// ═══════════════════════════════════════════════════════════════
// FRAMEWORK — easing, interpolate, TimelineContext, Sprite
// ═══════════════════════════════════════════════════════════════

const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

const Easing = {
  linear: (t) => t,
  easeInQuad:    (t) => t * t,
  easeOutQuad:   (t) => t * (2 - t),
  easeInOutQuad: (t) => (t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t),
  easeInCubic:    (t) => t * t * t,
  easeOutCubic:   (t) => (--t) * t * t + 1,
  easeInOutCubic: (t) => (t < 0.5 ? 4 * t * t * t : (t - 1) * (2 * t - 2) * (2 * t - 2) + 1),
  easeOutBack: (t) => {
    const c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  },
  easeOutElastic: (t) => {
    const c4 = (2 * Math.PI) / 3;
    if (t === 0) return 0;
    if (t === 1) return 1;
    return Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * c4) + 1;
  },
};

const TimelineContext = React.createContext({ time: 0, duration: 60, playing: true });
const useTime = () => React.useContext(TimelineContext).time;
const useTimeline = () => React.useContext(TimelineContext);

const SpriteContext = React.createContext({ localTime: 0, progress: 0, duration: 0 });
const useSprite = () => React.useContext(SpriteContext);

function Sprite({ start = 0, end = Infinity, children, keepMounted = false }) {
  const { time } = useTimeline();
  const visible = time >= start && time <= end;
  if (!visible && !keepMounted) return null;
  const duration = end - start;
  const localTime = Math.max(0, time - start);
  const progress = duration > 0 && isFinite(duration) ? clamp(localTime / duration, 0, 1) : 0;
  const value = { localTime, progress, duration, visible };
  return (
    <SpriteContext.Provider value={value}>
      {typeof children === 'function' ? children(value) : children}
    </SpriteContext.Provider>
  );
}

// ═══════════════════════════════════════════════════════════════
// VISUAL PRIMITIVES
// ═══════════════════════════════════════════════════════════════

const GoldParticles = ({ count = 80, opacity = 1 }) => {
  const parts = React.useMemo(() =>
    [...Array(count)].map((_, i) => ({
      id: i,
      x: Math.random() * 1920,
      yStart: 1080 + Math.random() * 300,
      speed: 18 + Math.random() * 32,
      size: 1.2 + Math.random() * 3,
      drift: (Math.random() - 0.5) * 240,
      phase: Math.random() * Math.PI * 2,
      amp: 12 + Math.random() * 32,
      hue: Math.random() > 0.7 ? '#9FE4D0' : '#FFE3A8',
    })), [count]);

  const t = useTime();
  return (
    <>
      {parts.map(p => {
        const y = p.yStart - (t * p.speed * 10) % 1600;
        const x = p.x + Math.sin(t * 1.5 + p.phase) * p.amp + (p.drift * t / 20);
        const blink = 0.5 + Math.sin(t * 3 + p.phase) * 0.4;
        return (
          <div key={p.id} style={{
            position: 'absolute',
            left: x, top: y,
            width: p.size * 2, height: p.size * 2,
            borderRadius: '50%',
            background: p.hue,
            boxShadow: `0 0 ${p.size * 8}px ${p.hue}`,
            opacity: blink * opacity,
            pointerEvents: 'none',
          }} />
        );
      })}
    </>
  );
};

const OrnateRings = ({ x, y, progress }) => {
  const rings = [
    { r: 180, dash: '2 6', color: '#E8C170', opacity: 0.8 },
    { r: 240, dash: '1 12', color: '#E8C170', opacity: 0.5 },
    { r: 310, dash: '4 4', color: '#9FE4D0', opacity: 0.3 },
    { r: 390, dash: '1 20', color: '#E8C170', opacity: 0.25 },
  ];
  const t = useTime();
  return (
    <svg width="900" height="900" style={{ position: 'absolute', left: x - 450, top: y - 450, pointerEvents: 'none' }}>
      {rings.map((r, i) => (
        <circle
          key={i}
          cx="450" cy="450" r={r.r * progress}
          fill="none"
          stroke={r.color}
          strokeWidth="1"
          strokeDasharray={r.dash}
          opacity={r.opacity * progress}
          style={{
            transform: `rotate(${t * (i % 2 ? 8 : -5)}deg)`,
            transformOrigin: '450px 450px',
          }}
        />
      ))}
    </svg>
  );
};

const LightRibbons = ({ intensity = 1 }) => {
  const t = useTime();
  const ribbons = 5;
  const paths = [];
  for (let r = 0; r < ribbons; r++) {
    const phase = r * 1.4;
    const pts = [];
    for (let x = -200; x <= 2120; x += 20) {
      const y1 = 540 + Math.sin((x * 0.003) + t * 0.8 + phase) * 140
                     + Math.sin((x * 0.007) + t * 1.3 + phase) * 60;
      pts.push(`${x},${y1}`);
    }
    paths.push({ d: 'M ' + pts.join(' L '), phase });
  }
  return (
    <svg viewBox="0 0 1920 1080" style={{ position: 'absolute', inset: 0, width: '100%', height: '100%' }}>
      <defs>
        <linearGradient id="ribGold" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stopColor="#E8C170" stopOpacity="0" />
          <stop offset="50%" stopColor="#FFE3A8" stopOpacity={0.9 * intensity} />
          <stop offset="100%" stopColor="#E8C170" stopOpacity="0" />
        </linearGradient>
        <linearGradient id="ribMint" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stopColor="#9FE4D0" stopOpacity="0" />
          <stop offset="50%" stopColor="#9FE4D0" stopOpacity={0.6 * intensity} />
          <stop offset="100%" stopColor="#9FE4D0" stopOpacity="0" />
        </linearGradient>
        <filter id="ribGlow"><feGaussianBlur stdDeviation="3" /></filter>
      </defs>
      {paths.map((p, i) => (
        <path
          key={i}
          d={p.d}
          fill="none"
          stroke={i % 2 ? 'url(#ribMint)' : 'url(#ribGold)'}
          strokeWidth={1.5 + (i % 2) * 0.8}
          filter="url(#ribGlow)"
          opacity={intensity}
        />
      ))}
    </svg>
  );
};

const Staff = ({ x, y, width, progress = 1, withClef = true, notes = [] }) => {
  const lineSpacing = 22;
  const lines = [0, 1, 2, 3, 4];
  return (
    <svg
      viewBox={`0 0 ${width} ${lineSpacing * 5 + 200}`}
      width={width}
      height={lineSpacing * 5 + 200}
      style={{ position: 'absolute', left: x, top: y - 100, overflow: 'visible' }}
    >
      <defs>
        <linearGradient id={'staffGold-' + x} x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stopColor="#B8894A" stopOpacity="0" />
          <stop offset="10%" stopColor="#E8C170" />
          <stop offset="50%" stopColor="#FFE3A8" />
          <stop offset="90%" stopColor="#E8C170" />
          <stop offset="100%" stopColor="#B8894A" stopOpacity="0" />
        </linearGradient>
        <filter id="noteGlow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="2" />
          <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      {lines.map(i => {
        const dashArr = width;
        const off = dashArr * (1 - Math.min(1, progress * 1.5 - i * 0.08));
        return (
          <line
            key={i}
            x1="0" y1={100 + i * lineSpacing}
            x2={width} y2={100 + i * lineSpacing}
            stroke={`url(#staffGold-${x})`}
            strokeWidth="1.4"
            strokeDasharray={dashArr}
            strokeDashoffset={Math.max(0, off)}
          />
        );
      })}
      {withClef && progress > 0.4 && (
        <text
          x="10" y={100 + lineSpacing * 3.2}
          fontSize="120"
          fill="#FFE3A8"
          fontFamily="'Cormorant Garamond', serif"
          filter="url(#noteGlow)"
          opacity={(progress - 0.4) / 0.3}
        >𝄞</text>
      )}
      {notes.map((n, i) => {
        if (n.appearAt && progress < n.appearAt) return null;
        const appearT = n.appearAt || 0;
        const alpha = Math.min(1, (progress - appearT) / 0.05);
        return (
          <g key={i} style={{ opacity: alpha }}>
            <ellipse
              cx={n.x} cy={100 + n.line * lineSpacing / 2}
              rx="8" ry="6"
              fill={n.half ? 'none' : '#FFE3A8'}
              stroke="#FFE3A8"
              strokeWidth="2"
              transform={`rotate(-18 ${n.x} ${100 + n.line * lineSpacing / 2})`}
              filter="url(#noteGlow)"
            />
            <line
              x1={n.x + 7} y1={100 + n.line * lineSpacing / 2 - 2}
              x2={n.x + 7} y2={100 + n.line * lineSpacing / 2 - 70}
              stroke="#FFE3A8" strokeWidth="1.6"
            />
          </g>
        );
      })}
    </svg>
  );
};

const Waveform = ({ x, y, width, height, amplitude = 1, opacity = 1 }) => {
  const t = useTime();
  const pts = [];
  for (let i = 0; i <= width; i += 6) {
    const env = Math.sin((i / width) * Math.PI);
    const v1 = Math.sin((i * 0.02) + t * 2.5) * 60 * env * amplitude;
    const v2 = Math.sin((i * 0.05) + t * 3.5) * 30 * env * amplitude;
    const v3 = Math.sin((i * 0.11) + t * 5) * 15 * env * amplitude;
    pts.push(`${i},${height / 2 + v1 + v2 + v3}`);
  }
  const mirror = [];
  for (let i = 0; i <= width; i += 6) {
    const env = Math.sin((i / width) * Math.PI);
    const v1 = Math.sin((i * 0.02) + t * 2.5) * 60 * env * amplitude;
    const v2 = Math.sin((i * 0.05) + t * 3.5) * 30 * env * amplitude;
    mirror.push(`${i},${height / 2 - (v1 + v2)}`);
  }
  return (
    <svg width={width} height={height} style={{ position: 'absolute', left: x, top: y, opacity }}>
      <defs>
        <linearGradient id="wfGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stopColor="#B8894A" stopOpacity="0" />
          <stop offset="20%" stopColor="#E8C170" />
          <stop offset="80%" stopColor="#FFE3A8" />
          <stop offset="100%" stopColor="#E8C170" stopOpacity="0" />
        </linearGradient>
      </defs>
      <path d={'M ' + pts.join(' L ')} fill="none" stroke="url(#wfGrad)" strokeWidth="2" />
      <path d={'M ' + mirror.join(' L ')} fill="none" stroke="#9FE4D0" strokeWidth="1.2" opacity="0.6" />
      {[...Array(60)].map((_, i) => {
        const xi = (i / 60) * width;
        const env = Math.sin((xi / width) * Math.PI);
        const amp = Math.abs(Math.sin((xi * 0.02) + t * 2.5) * 60 +
                              Math.sin((xi * 0.05) + t * 3.5) * 30) * env * amplitude;
        return (
          <line key={i}
            x1={xi} y1={height / 2 - amp} x2={xi} y2={height / 2 + amp}
            stroke="#E8C170" strokeWidth="1" opacity="0.35"
          />
        );
      })}
    </svg>
  );
};

const Aureole = ({ x, y, r = 600, color = 'rgba(232, 193, 112, 0.35)', pulse = true }) => {
  const t = useTime();
  const scale = pulse ? 1 + Math.sin(t * 1.2) * 0.08 : 1;
  return (
    <div style={{
      position: 'absolute',
      left: x - r, top: y - r,
      width: r * 2, height: r * 2,
      borderRadius: '50%',
      background: `radial-gradient(circle, ${color} 0%, transparent 65%)`,
      filter: 'blur(60px)',
      transform: `scale(${scale})`,
      pointerEvents: 'none',
    }} />
  );
};

// ═══════════════════════════════════════════════════════════════
// SCENE 1 — Opening Title (0–8s)
// ═══════════════════════════════════════════════════════════════
const Scene1 = () => (
  <Sprite start={0} end={8}>
    {({ localTime, progress }) => {
      const titleIn = Math.min(1, Math.max(0, (localTime - 1.2) / 1.2));
      const subIn = Math.min(1, Math.max(0, (localTime - 2.6) / 0.8));
      const ringsOut = Math.min(1, Math.max(0, (localTime - 0.3) / 2));
      return (
        <>
          <Aureole x={960} y={540} r={600} color="rgba(232, 193, 112, 0.45)" />
          <GoldParticles count={90} />
          <OrnateRings x={960} y={540} progress={ringsOut} />
          <div style={{
            position: 'absolute',
            left: 960, top: 420,
            transform: `translate(-50%, -50%) scale(${0.2 + ringsOut * 1.2})`,
            fontSize: 320,
            fontFamily: "'Cormorant Garamond', serif",
            color: '#FFE3A8',
            textShadow: '0 0 60px rgba(232, 193, 112, 0.8), 0 0 120px rgba(232, 193, 112, 0.4)',
            opacity: ringsOut * (localTime < 6.5 ? 1 : Math.max(0, 1 - (localTime - 6.5) / 1.2)),
          }}>𝄞</div>
          <div style={{
            position: 'absolute',
            left: 960, top: 760,
            transform: `translate(-50%, ${(1 - titleIn) * 30}px)`,
            opacity: titleIn * (localTime < 7 ? 1 : Math.max(0, 1 - (localTime - 7) / 0.8)),
            textAlign: 'center',
            pointerEvents: 'none',
          }}>
            <div style={{
              fontFamily: "'Zen Old Mincho', serif",
              fontSize: 28,
              letterSpacing: '0.6em',
              color: '#E8C170',
              marginBottom: 24,
              paddingLeft: '0.6em',
            }}>A I 楽 譜</div>
            <div style={{
              fontFamily: "'Cormorant Garamond', serif",
              fontStyle: 'italic',
              fontSize: 52,
              fontWeight: 300,
              color: '#F6F1E4',
              letterSpacing: '0.02em',
              opacity: subIn,
              transform: `translateY(${(1 - subIn) * 16}px)`,
            }}>Where music finds its form</div>
            <div style={{
              width: 120,
              height: 1,
              background: 'linear-gradient(90deg, transparent, #E8C170, transparent)',
              margin: '32px auto 0',
              opacity: subIn,
              transform: `scaleX(${subIn})`,
            }} />
          </div>
        </>
      );
    }}
  </Sprite>
);

// ═══════════════════════════════════════════════════════════════
// SCENE 2 — User Prompt (8–18s)
// ═══════════════════════════════════════════════════════════════
const Scene2 = () => (
  <Sprite start={8} end={18}>
    {({ localTime }) => {
      const fullText = '雨上がりの街を、ピアノで。';
      const typedLen = Math.min(fullText.length, Math.floor((localTime - 1.2) / 0.18));
      const typed = localTime > 1.2 ? fullText.slice(0, typedLen) : '';
      const seedOut = Math.max(0, Math.min(1, (localTime - 6.5) / 1.5));
      const panelIn = Math.min(1, Math.max(0, (localTime - 0.3) / 0.8));
      return (
        <>
          <Aureole x={960} y={540} r={500} color="rgba(232, 193, 112, 0.2)" pulse={false} />
          <GoldParticles count={35} opacity={0.5} />
          <div style={{
            position: 'absolute',
            left: 960, top: 240,
            transform: 'translate(-50%, 0)',
            textAlign: 'center',
            whiteSpace: 'nowrap',
            opacity: panelIn * (localTime > 8.5 ? Math.max(0, 1 - (localTime - 8.5) / 1) : 1),
          }}>
            <div style={{
              fontFamily: "'Cormorant Garamond', serif",
              fontStyle: 'italic',
              fontSize: 18,
              letterSpacing: '0.35em',
              color: '#E8C170',
              marginBottom: 20,
              textTransform: 'uppercase',
            }}>— Chapter I —</div>
            <div style={{
              fontFamily: "'Cormorant Garamond', serif",
              fontSize: 64,
              fontWeight: 300,
              color: '#F6F1E4',
              fontStyle: 'italic',
            }}>Imagine a melody.</div>
            <div style={{
              fontFamily: "'Zen Old Mincho', serif",
              fontSize: 22,
              color: 'rgba(246, 241, 228, 0.65)',
              letterSpacing: '0.2em',
              marginTop: 12,
            }}>— 思いを、ことばで。</div>
          </div>
          <div style={{
            position: 'absolute',
            left: 960, top: 540,
            transform: `translate(-50%, -50%) scale(${0.85 + panelIn * 0.15})`,
            width: 1100,
            padding: '40px 56px',
            background: 'rgba(27, 32, 96, 0.55)',
            backdropFilter: 'blur(12px)',
            border: '1px solid rgba(232, 193, 112, 0.4)',
            borderRadius: 18,
            boxShadow: '0 40px 120px rgba(0,0,0,0.5), 0 0 60px rgba(232, 193, 112, 0.15)',
            opacity: panelIn,
          }}>
            <div style={{
              display: 'flex', alignItems: 'center', gap: 14,
              marginBottom: 24,
              fontFamily: "'Zen Old Mincho', serif",
              fontSize: 14,
              letterSpacing: '0.3em',
              color: '#9FE4D0',
            }}>
              <div style={{ width: 8, height: 8, background: '#9FE4D0', borderRadius: '50%', boxShadow: '0 0 12px #9FE4D0' }} />
              Your Prompt · プロンプト
            </div>
            <div style={{
              fontFamily: "'Zen Old Mincho', serif",
              fontSize: 54,
              color: '#F6F1E4',
              letterSpacing: '0.04em',
              minHeight: 72,
            }}>
              {typed}
              <span style={{
                display: 'inline-block',
                width: 3, height: 52,
                background: '#FFE3A8',
                marginLeft: 8,
                verticalAlign: 'middle',
                opacity: Math.sin(localTime * 6) > 0 ? 1 : 0,
              }} />
            </div>
          </div>
          {seedOut > 0 && (
            <div style={{
              position: 'absolute',
              left: 960, top: 840,
              transform: `translate(-50%, -50%) scale(${seedOut})`,
              width: 200, height: 200,
              borderRadius: '50%',
              background: 'radial-gradient(circle, #FFE3A8 0%, #E8C170 40%, transparent 70%)',
              opacity: 0.9 - seedOut * 0.3,
              filter: 'blur(8px)',
            }} />
          )}
        </>
      );
    }}
  </Sprite>
);

// ═══════════════════════════════════════════════════════════════
// SCENE 3 — AI composes (18–30s)
// ═══════════════════════════════════════════════════════════════

const CentralSpectrum = ({ time, intensity }) => {
  const bars = 72;
  const cx = 960, cy = 600;
  return (
    <svg width="1920" height="1080" style={{ position: 'absolute', inset: 0, overflow: 'visible', opacity: intensity }}>
      <defs>
        <radialGradient id="corePulse">
          <stop offset="0%" stopColor="#FFE3A8" />
          <stop offset="40%" stopColor="#E8C170" stopOpacity="0.6" />
          <stop offset="100%" stopColor="#E8C170" stopOpacity="0" />
        </radialGradient>
      </defs>
      <g style={{ transformOrigin: `${cx}px ${cy}px`, transform: `rotate(${time * 15}deg)` }}>
        <circle cx={cx} cy={cy} r="90" fill="none" stroke="#E8C170" strokeDasharray="4 8" opacity="0.4" />
      </g>
      <g style={{ transformOrigin: `${cx}px ${cy}px`, transform: `rotate(${-time * 9}deg)` }}>
        <circle cx={cx} cy={cy} r="150" fill="none" stroke="#9FE4D0" strokeDasharray="1 12" opacity="0.4" />
      </g>
      {[...Array(bars)].map((_, i) => {
        const angle = (i / bars) * Math.PI * 2;
        const h = 30 + Math.abs(Math.sin(time * 2.5 + i * 0.35)) * 80
                     + Math.abs(Math.cos(time * 3.4 + i * 0.22)) * 40;
        const r1 = 110;
        const r2 = r1 + h;
        const x1 = cx + Math.cos(angle) * r1;
        const y1 = cy + Math.sin(angle) * r1;
        const x2 = cx + Math.cos(angle) * r2;
        const y2 = cy + Math.sin(angle) * r2;
        return (
          <line key={i} x1={x1} y1={y1} x2={x2} y2={y2}
            stroke={i % 7 === 0 ? '#9FE4D0' : '#FFE3A8'}
            strokeWidth="2" strokeLinecap="round"
            opacity={0.5 + h / 200}
          />
        );
      })}
      <circle cx={cx} cy={cy} r={40 + Math.sin(time * 3) * 20} fill="url(#corePulse)" opacity="0.9" />
      <circle cx={cx} cy={cy} r="12" fill="#FFE3A8" />
    </svg>
  );
};

const InstrumentLabels = ({ time, intensity }) => {
  const labels = [
    { en: 'Piano', jp: 'ピアノ', angle: 0 },
    { en: 'Violin', jp: 'ヴァイオリン', angle: 60 },
    { en: 'Cello', jp: 'チェロ', angle: 120 },
    { en: 'Harp', jp: 'ハープ', angle: 180 },
    { en: 'Flute', jp: 'フルート', angle: 240 },
    { en: 'Horn', jp: 'ホルン', angle: 300 },
  ];
  const cx = 960, cy = 600, r = 360;
  return (
    <>
      {labels.map((l, i) => {
        const angle = (l.angle + time * 12) * Math.PI / 180;
        const x = cx + Math.cos(angle) * r;
        const y = cy + Math.sin(angle) * r * 0.55;
        const appear = Math.max(0, Math.min(1, (time - 1.2 - i * 0.15) / 0.4));
        return (
          <div key={i} style={{
            position: 'absolute',
            left: x, top: y,
            transform: 'translate(-50%, -50%)',
            opacity: intensity * appear * 0.85,
            pointerEvents: 'none',
            textAlign: 'center',
          }}>
            <div style={{
              fontFamily: "'Cormorant Garamond', serif",
              fontStyle: 'italic',
              fontSize: 22,

// BG STAGE — fills viewport with cover scaling, no controls
// ═══════════════════════════════════════════════════════════════
function BgStage({ children, duration = 60, background = '#0A0D26' }) {
  const WIDTH = 1920;
  const HEIGHT = 1080;
  const [time, setTime] = React.useState(0);
  const [scale, setScale] = React.useState(1);
  const rafRef = React.useRef(null);
  const lastTsRef = React.useRef(null);

  React.useEffect(() => {
    const measure = () => {
      const s = Math.max(window.innerWidth / WIDTH, window.innerHeight / HEIGHT);
      setScale(Math.max(0.1, s));
    };
    measure();
    window.addEventListener('resize', measure);
    return () => window.removeEventListener('resize', measure);
  }, []);

  React.useEffect(() => {
    const step = (ts) => {
      if (lastTsRef.current == null) lastTsRef.current = ts;
      const dt = (ts - lastTsRef.current) / 1000;
      lastTsRef.current = ts;
      setTime(t => {
        let next = t + dt;
        if (next >= duration) next = next % duration;
        return next;
      });
      rafRef.current = requestAnimationFrame(step);
    };
    rafRef.current = requestAnimationFrame(step);
    return () => { if (rafRef.current) cancelAnimationFrame(rafRef.current); };
  }, [duration]);

  const ctxValue = React.useMemo(
    () => ({ time, duration, playing: true, setTime: () => {}, setPlaying: () => {} }),
    [time, duration]
  );

  return (
    <div style={{
      position: 'fixed',
      inset: 0,
      overflow: 'hidden',
      background,
    }}>
      <div style={{
        position: 'absolute',
        top: '50%',
        left: '50%',
        width: WIDTH,
        height: HEIGHT,
        transform: `translate(-50%, -50%) scale(${scale})`,
        transformOrigin: 'center center',
      }}>
        <TimelineContext.Provider value={ctxValue}>
          {children}
        </TimelineContext.Provider>
      </div>
    </div>
  );
}
